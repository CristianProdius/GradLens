services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gradlens
      POSTGRES_USER: gradlens
      POSTGRES_PASSWORD: gradlens
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradlens -d gradlens"]
      interval: 5s
      timeout: 5s
      retries: 5

api:
    build:
      context: ./apps/api
    environment:
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
