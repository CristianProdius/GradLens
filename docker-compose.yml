services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gradlens
      POSTGRES_USER: gradlens
      POSTGRES_PASSWORD: gradlens
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradlens -d gradlens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
